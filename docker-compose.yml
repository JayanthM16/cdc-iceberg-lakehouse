# Real-time CDC pipeline: PostgreSQL -> Debezium -> Kafka -> Spark Structured Streaming -> Apache Iceberg
x-spark: &spark-common
  image: apache/spark:3.5.3
  user: root
  volumes:
    - ./spark:/opt/jobs
    - ./sql:/opt/sql
    - warehouse:/warehouse
    - checkpoints:/checkpoints
    - ivy:/tmp/ivy


services:
  postgres:
    image: postgres:16
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=4", "-c", "max_wal_senders=4"]
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: shop
    ports: ["5432:5432"]
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d shop"]
      interval: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.8.0
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3

  connect:
    image: quay.io/debezium/connect:2.7
    depends_on: [kafka, postgres]
    ports: ["8083:8083"]
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: "1"
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses

  # Long-running streaming job (Kafka -> Iceberg bronze + silver)
  spark-stream:
    <<: *spark-common
    depends_on: [kafka]
    restart: on-failure
    command: >
      /opt/spark/bin/spark-submit
      --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.3,org.apache.iceberg:iceberg-spark-runtime-3.5_2.12:1.6.1
      --conf spark.jars.ivy=/tmp/ivy
      /opt/jobs/cdc_to_iceberg.py

  # ---- on-demand tools: `docker compose run --rm <service>` ----
  generator:
    image: python:3.11-slim
    profiles: ["tools"]
    depends_on: [postgres]
    environment:
      PGHOST: postgres
      RATE: ${RATE:-50}
      DURATION: ${DURATION:-120}
    volumes:
      - ./generator:/app
    command: sh -c "pip install -q psycopg2-binary && python /app/generate.py"

  verify:
    <<: *spark-common
    profiles: ["tools"]
    command: >
      /opt/spark/bin/spark-submit
      --packages org.apache.iceberg:iceberg-spark-runtime-3.5_2.12:1.6.1,org.postgresql:postgresql:42.7.4
      --conf spark.jars.ivy=/tmp/ivy
      /opt/jobs/verify.py

  spark-sql:
    <<: *spark-common
    profiles: ["tools"]
    entrypoint:
      - /opt/spark/bin/spark-sql
      - --packages
      - org.apache.iceberg:iceberg-spark-runtime-3.5_2.12:1.6.1
      - --conf
      - spark.jars.ivy=/tmp/ivy
      - --conf
      - spark.sql.extensions=org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
      - --conf
      - spark.sql.catalog.lake=org.apache.iceberg.spark.SparkCatalog
      - --conf
      - spark.sql.catalog.lake.type=hadoop
      - --conf
      - spark.sql.catalog.lake.warehouse=/warehouse

volumes:
  warehouse:
  checkpoints:
  ivy:
